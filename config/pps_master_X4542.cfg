#
# Example configuration for sfptpd operating as a PPS master with the X4542.
# The local NIC clock free-runs and is advertised to PTP slaves; the NIC
# generates the PPS signal on the configured output pin.
#
# SPDX-License-Identifier: BSD-3-Clause
# (c) Copyright 2026 Advanced Micro Devices, Inc.
#

#
# X4542 typically has a single physical PPS pin which can be programmed
# as either a PPS input or output (dual-use). 
# To list the pins your adapter exposes and their current function, run:
#     tstool clock pps_list <interface>
# An X4542 may report the following:
#     pin 0 -> pps-in channel 0
#     pin 1 -> none channel 0
# Pin 0 is the dual-use PPS pin. Pin 1 is typically unused unless
# the X4542 is fitted with the two-pin bracket kit.
#

#
# Generic Configuration
#
[general]

# Create Synchronization Module instances.
sync_module freerun fr1
sync_module pps pps1
sync_module ptp ptp1

# Specify whether messages are sent to the syslog, stderr or to a file. By default
# messages are sent to stderr.
# message_log /local/sfptpd_msgs.txt
message_log stderr

# Specify whether stats logging is enabled and whether stats are sent to stdout
# or to a file
# stats_log /local/sfptpd_stats.txt
stats_log stdout

# Specifies whether to attempt using hardware timestamps on non-Solarflare
# hardware. Its driver must support raw hardware timestamps and expose a PHC
# device adjustable via clock_adjtime (adjtimex).
non_solarflare_nics off

#
# PPS Source Configuration
#
[pps1]

# Replace eth1 with the interface whose PPS output pin is wired to the PPS
# consumer.
#interface eth1

# Enable PPS-out signal on the dual-use PPS pin. On X4542, the best
# practice is to set the pin explicitly. Confirm the correct pin for your
# adapter with
#     'tstool clock pps_list eth1'.
function pps-out
pin 0

#
# PTP Instance Configuration
#
[ptp1]

# Advertise the NIC clock associated with the interface as a PTP master.
#interface eth1
ptp_mode master-only
ptp_network_mode hybrid

#
# Freerun Configuration
#
[fr1]

# Specify the interface to use.
#interface eth1

# Advertise the master clock quality. Although the clock is really free-running,
# declaring a finite accuracy (meeting the ~330 ms requirement used by the PPS slave)
# is what lets a downstream PPS slave accept the time source as a valid
# time-of-day source. (e.g. Set if testing PTP time-of-day on PPS slave)
#clock_class locked
#clock_accuracy 300

# Set the highest priority
priority 10

# fin
