#
# Example configuration for sfptpd operating in PPS mode with the X4542.
# Uses chrony to get the time of day.
#
# SPDX-License-Identifier: BSD-3-Clause
# (c) Copyright 2026 Advanced Micro Devices, Inc.

#
# X4542 typically has a single physical PPS pin which can be programmed
# as either a PPS input or output (dual-use). 
# To list the pins your adapter exposes and their current function, run:
#     tstool clock pps_list <interface>
# An X4542 may report the following:
#     pin 0 -> pps-in channel 0
#     pin 1 -> none channel 0
# Pin 0 is the dual-use PPS pin. Pin 1 is typically unused unless
# the X4542 is fitted with the two-pin bracket kit.
#

#
# Generic Configuration
#
[general]

# Create a PPS Synchronization Module instance.
sync_module pps pps1

# Step the PPS module once the time-of-day source has been locked.
clock_control step-on-first-lock

# Create the chrony time-of-day Synchronization Module instance.
# This is necessary to control whether chronyd disciplines the system clock
# at runtime.
sync_module crny crny1

# Create a PTP Synchronization Module instance for cross-reference.
# This is NOT the time-of-day source (chrony above remains time_of_day). It is
# a deliberately low-priority PTP slave instance whose only purpose is to give
# an independent PTP measurement of the same master, so the PPS offset can be
# checked against PTP in the stats logs.
sync_module ptp ptp1

# Use manual sync instance switching to ensure the PPS sync instance is chosen
# in preference to the time-of-day sync instance. This prevents the chrony sync
# instance from being selected if the PPS sync instance is faulty. To allow a
# fallback, comment this line out or set to the default 'automatic'. The
# selected instance can be changed manually with the sfptpdctl program.
selection_policy manual pps1

# Specify whether messages are sent to the syslog, stderr or to a file. By default
# messages are sent to stderr.
# message_log /local/sfptpd_msgs.txt
message_log stderr

# Specify whether stats logging is enabled and whether stats are sent to stdout
# or to a file
#stats_log /tmp/sfptpd_stats.txt
stats_log stdout

# Specifies whether to attempt using hardware timestamps on non-Solarflare
# hardware. Its driver must support raw hardware timestamps and expose a PHC
# device adjustable via clock_adjtime (adjtimex).
non_solarflare_nics off

#
# Generic PPS Configuration
#
[pps]

# Set the sync instance to use for a time-of-day source explicitly. Defaults to
# the chrony sync instance.
time_of_day crny1

#
# PPS Source Configuration
#
[pps1]

# Specify an interface on the X4542 receiving the PPS input.
# Can also be specified on the command line using the -i option.
#interface eth1

# Receive the PPS signal. On X4542, the best practice is to set the pin
# explicitly. Confirm the correct pin for your adapter with 
#     'tstool clock pps_list eth1'.
function pps-in
pin 0

# If the X4542 is fitted with the two-pin bracket kit, the second PPS pin
# should be used.
# function pps-in
# pin 1

# Define the characteristics of the master clock so that sfptpd can make the
# correct decision about which sync instance to select. Without setting these
# values sfptpd will assume the worse and would not select the PPS sync instance
# over another un-alarmed instance in the slave state if the automatic selection
# policy is in use. These should be set if known and will be passed on to slaves
# (with additional inaccuracy) if also operating as a PTP master.
master_clock_class locked
master_time_source gps
master_accuracy 100


# Gives the PPS sync instance a user priority to ensure it is selected in
# preference to the time-of-day sync instance when PPS is working and if the
# automatic selection policy has been configured.
priority 10

# Set PPS propagation delay
pps_delay 0

#
# Time-of-day (chrony) Configuration
#
[crny1]

# Enable clock control with chrony. Currently a helper script is required to
# restart chronyd to work around its lack of a runtime control mechanism.
clock_control on

# Gives the time-of-day sync instance a user priority that is worse than that
# set for the PPS sync instance so that it is not selected if PPS is available
# and the automatic selection policy is configured.
priority 20

#
# PTP Configuration
#
[ptp1]

# This instance does not discipline the clock (selection_policy manual pps1
# above).
ptp_mode slave
#interface eth1
ptp_network_mode hybrid

# Lowest priority so it is never selected over PPS or chrony.
priority 40

# fin
